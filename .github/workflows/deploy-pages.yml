name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No content:pull step: the WordPress install is retired, so content and
      # media are committed to the repo and are the source of truth.

      - uses: actions/configure-pages@v5
        id: pages

      # origin/base_path come from the Pages config, so this needs no edits
      # when the custom domain is attached: origin becomes
      # https://nestorhorizoneu.com and base_path becomes empty.
      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      # Needs the same BASE_PATH as the build: the emitted URLs are prefixed,
      # so without it the checker flags every correct link as broken.
      - name: Verify no broken links
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run check:links

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
